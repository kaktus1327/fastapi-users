<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSIZ · Users</title>
<link rel="icon" href="/static/logo_wsiz.svg">
<style>
  :root {
    --navy: #082970;
    --navy-soft: #1a3f8f;
    --bg: #eef1f7;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --danger: #b91c1c;
    --mark: #ffe066;
    --shadow: 0 1px 2px rgba(8, 41, 112, .06), 0 8px 24px rgba(8, 41, 112, .08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #6f92e0;
      --navy-soft: #8fabe9;
      --bg: #0b1220;
      --surface: #131c2e;
      --text: #e8eefc;
      --muted: #94a3b8;
      --line: #243149;
      --danger: #f87171;
      --mark: #7a5c00;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #ffffff;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
  }
  .logo img { width: 34px; height: 34px; display: block; }
  .bar .titles { display: flex; flex-direction: column; }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .bar span { font-size: 12.5px; color: var(--muted); }
  main { max-width: 780px; margin: 0 auto; padding: 26px 22px 72px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 18px; }
  .card h2 {
    margin: 0;
    padding: 14px 18px;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  form { display: flex; gap: 10px; padding: 16px 18px; flex-wrap: wrap; }
  input {
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: inherit;
    font: inherit;
    min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: 0;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(8, 41, 112, .13);
    background: var(--surface);
  }
  #name { flex: 1 1 220px; }
  #age { width: 100px; }
  button.primary {
    padding: 10px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--navy);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button.primary:hover { background: var(--navy-soft); }
  .err { color: var(--danger); font-size: 13px; padding: 0 18px 14px; }
  .err:empty { display: none; }
  .search { position: relative; padding: 16px 18px; }
  .search svg {
    position: absolute;
    left: 32px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 2;
    pointer-events: none;
  }
  #q { width: 100%; padding-left: 38px; }
  .listhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .pill {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 18px;
    border-top: 1px solid var(--line);
  }
  .avatar {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 650;
    text-transform: uppercase;
  }
  .who { flex: 1; min-width: 0; }
  .who b { font-weight: 600; display: block; }
  .who small { color: var(--muted); font-size: 12px; }
  .age { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .del {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  li:last-child { border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); }
  .empty { display: block; padding: 26px 18px 30px; text-align: center; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><img src="/static/logo_wsiz.svg" alt="Logo WSIZ"></div>
    <div class="titles">
      <h1>User registry</h1>
      <span>University of Information Technology and Management</span>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <h2>Add user</h2>
    <form id="create">
      <input id="name" placeholder="Name, e.g. Timothy" maxlength="100" required autocomplete="off">
      <input id="age" type="number" min="0" max="150" placeholder="Age" required>
      <button class="primary" type="submit">Add</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <h2>Prefix search</h2>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Start typing, e.g. tim — the list filters as you type" autocomplete="off" autofocus>
    </div>
    <div class="listhead">
      <span id="label">All users</span>
      <span class="pill" id="count">—</span>
    </div>
    <ul id="list"></ul>
  </section>

</main>

<script>
const el = (id) => document.getElementById(id);
let timer, seq = 0;

function nameCell(name, prefix) {
  const frag = document.createDocumentFragment();
  if (prefix && name.length >= prefix.length) {
    const head = document.createElement("mark");
    head.textContent = name.slice(0, prefix.length);
    frag.append(head, document.createTextNode(name.slice(prefix.length)));
  } else {
    frag.append(document.createTextNode(name));
  }
  return frag;
}

function plural(n) {
  return n === 1 ? "result" : "results";
}

function syncUrl(q) {
  const next = q ? `${location.pathname}?q=${encodeURIComponent(q)}` : location.pathname;
  history.replaceState(null, "", next);
}

async function load() {
  const q = el("q").value.trim();
  syncUrl(q);
  const current = ++seq;
  const url = new URL("/users", location.origin);
  url.searchParams.set("limit", "50");
  if (q) url.searchParams.set("q", q);

  let page;
  try {
    const res = await fetch(url);
    page = await res.json();
  } catch {
    return;
  }
  if (current !== seq) return;

  el("label").textContent = q ? `Prefix "${q}"` : "All users";
  el("count").textContent = `${page.total} ${plural(page.total)}`;

  const list = el("list");
  list.replaceChildren();

  if (!page.items.length) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = q ? `No users starting with "${q}"` : "No users yet — add the first one above";
    list.append(empty);
    return;
  }

  for (const user of page.items) {
    const li = document.createElement("li");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = [...user.name][0] ?? "?";

    const who = document.createElement("div");
    who.className = "who";
    const strong = document.createElement("b");
    strong.append(nameCell(user.name, q));
    const id = document.createElement("small");
    id.textContent = user.id.slice(0, 8);
    who.append(strong, id);

    const age = document.createElement("div");
    age.className = "age";
    age.textContent = `${user.age} yrs`;

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "Delete";
    del.onclick = async () => {
      del.disabled = true;
      await fetch(`/users/${user.id}`, { method: "DELETE" });
      load();
    };

    li.append(avatar, who, age, del);
    list.append(li);
  }
}

el("q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(load, 120);
});

el("create").addEventListener("submit", async (event) => {
  event.preventDefault();
  el("err").textContent = "";
  const res = await fetch("/users", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: el("name").value, age: Number(el("age").value) }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    el("err").textContent = body?.error?.message ?? "Could not add the user";
    return;
  }
  el("create").reset();
  el("name").focus();
  load();
});

el("q").value = new URLSearchParams(location.search).get("q") ?? "";
load();
</script>
</body>
</html>
